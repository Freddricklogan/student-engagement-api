# Fly.io deployment config.
# One-click-ish: `fly launch --copy-config --now` then open the printed URL.
# Set `app` to the name Fly assigns you before the first deploy.

app = "student-engagement-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  # Demo mode keeps the deployed URL useful with no signup: it seeds the
  # deterministic dataset and creates the read-only `demo` account.
  DEMO_MODE = "true"
  LOG_FORMAT = "json"
  LOG_LEVEL = "INFO"
  RATE_LIMIT_ENABLED = "true"
  PORT = "8000"
  DATABASE_URL = "sqlite+aiosqlite:////data/engagement.db"

# Persist the SQLite database across deploys.
# Create it once: fly volumes create engagement_data --size 1
[[mounts]]
  source = "engagement_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Secrets are NOT stored here. Before going beyond the demo:
#   fly secrets set DEMO_MODE=false JWT_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
#   fly secrets set CORS_ALLOW_ORIGINS="https://<your-app>.fly.dev"
